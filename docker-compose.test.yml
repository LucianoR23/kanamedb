# Motores para los tests de integración.
#
# El plan pide tener los cuatro desde el día uno porque el differ se rompe en
# silencio. Por ahora está Postgres, que es el motor de la Iteración 1; MySQL,
# MariaDB y SQLite se suman en la Iteración 6.
#
#   docker compose -f docker-compose.test.yml up -d
#   go test -count=1 ./...
#
# El -count=1 no es opcional al cambiar de versión de motor: la caché de go test
# no sabe qué base está escuchando, así que sin él una corrida contra Postgres 16
# puede devolver el resultado cacheado de la corrida anterior contra la 18. Es
# una verificación falsa que parece verdadera.
#
# Los tests de integración se saltean solos, con un mensaje que explica esto, si
# no hay una base escuchando. No hay build tag: así el código de test siempre
# compila y pasa vet.
#
# La versión de cada motor se elige por variable —PG_VERSION, MYSQL_VERSION,
# MYSQL_LTS_VERSION, MARIADB_VERSION, MARIADB_LTS_VERSION—. Los defaults son la
# estable actual de cada uno; CI corre la matriz de versiones soportadas:
#
#   PG_VERSION=17 docker compose -f docker-compose.test.yml up -d
#
# Para MySQL «la estable actual» necesita una aclaración, porque desde la 8.4
# hay dos carriles: los LTS, con soporte de años, y los Innovation, sostenidos
# solo hasta la release siguiente. Se prueba contra **LTS**: es lo que corre en
# las bases de las que la gente se preocupa. En septiembre de 2026 eso es 9.7
# (la última) y 8.4 (la que está instalada en todos lados). El carril
# Innovation queda fuera a propósito.
#
# Las credenciales son de juguete y el puerto está corrido a propósito, para no
# chocar con una instalación local ni tentar a nadie a apuntar esto a algo real.

services:
  # Imagen propia sobre la oficial, solo para tener TLS encendido con un
  # certificado autofirmado que se genera en el build. Ver docker/postgres.
  postgres:
    build:
      context: ./docker/postgres
      args:
        PG_VERSION: ${PG_VERSION:-18}
    environment:
      POSTGRES_USER: kaname
      POSTGRES_PASSWORD: kaname
      POSTGRES_DB: kaname_test
      # Acelera el arranque: estos datos son descartables.
      POSTGRES_INITDB_ARGS: "--no-sync"
    ports:
      - "55432:5432"
    tmpfs:
      # Todo en memoria: los tests recrean el esquema en cada corrida y nada de
      # esto debe sobrevivir a un reinicio.
      #
      # El punto de montaje es /var/lib/postgresql y no .../data: desde la 18 la
      # imagen guarda los datos en un subdirectorio por versión mayor, y un
      # montaje en .../data la hace abortar al arrancar. Montar el padre sirve
      # para 18+ y también para las versiones anteriores, donde PGDATA queda
      # adentro igual.
      - /var/lib/postgresql
    command: >
      postgres
      -c fsync=off
      -c full_page_writes=off
      -c synchronous_commit=off
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaname -d kaname_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MySQL. Sin volumen: todo en tmpfs, igual que Postgres.
  #
  # Las DOS LTS a la vez, por el mismo motivo que las dos MariaDB: el comentario
  # de arriba decía «se prueba contra LTS: 9.7 y 8.4» y solo estaba la 9.7. Una
  # versión declarada soportada contra la que no corre un solo test es una
  # promesa sin comprobar, y este proyecto ya se comió una: la 10.11 de MariaDB
  # no conectaba en absoluto.
  mysql:
    image: mysql:${MYSQL_VERSION:-9.7}
    environment:
      MYSQL_ROOT_PASSWORD: kaname
      MYSQL_DATABASE: kaname_test
      MYSQL_USER: kaname
      MYSQL_PASSWORD: kaname
    ports:
      - "53306:3306"
    tmpfs:
      - /var/lib/mysql
    command: >
      --skip-innodb-doublewrite
      --innodb-flush-log-at-trx-commit=0
      --sync-binlog=0
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ukaname -pkaname --silent"]
      interval: 2s
      timeout: 3s
      retries: 40

  mysql-lts:
    image: mysql:${MYSQL_LTS_VERSION:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: kaname
      MYSQL_DATABASE: kaname_test
      MYSQL_USER: kaname
      MYSQL_PASSWORD: kaname
    ports:
      - "53309:3306"
    tmpfs:
      - /var/lib/mysql
    command: >
      --skip-innodb-doublewrite
      --innodb-flush-log-at-trx-commit=0
      --sync-binlog=0
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ukaname -pkaname --silent"]
      interval: 2s
      timeout: 3s
      retries: 40

  # MariaDB aparte y no como variante de la imagen de MySQL. Hace años que no
  # son el mismo servidor: divergen en tipos, en funciones y en cómo se lee el
  # catálogo, y probar uno solo dejaría al otro sin cubrir justo donde se
  # separan.
  # La MariaDB nueva y la LTS más vieja que la aplicación declara soportar, las
  # DOS a la vez y no una elegida por variable de entorno.
  #
  # No es exceso de celo: probando solo 12.3, la 10.11 no conectaba en absoluto
  # —«Unknown system variable 'transaction_read_only'», porque esa variable
  # llegó recién en 11.1.1— y nadie se enteraba. Declarar una versión soportada
  # y no correr un solo test contra ella es prometer sin comprobar. Las dos van
  # en tmpfs, así que el costo es memoria y arranque, no disco.
  mariadb:
    image: mariadb:${MARIADB_VERSION:-12.3}
    environment:
      MARIADB_ROOT_PASSWORD: kaname
      MARIADB_DATABASE: kaname_test
      MARIADB_USER: kaname
      MARIADB_PASSWORD: kaname
    ports:
      - "53307:3306"
    tmpfs:
      - /var/lib/mysql
    command: >
      --innodb-flush-log-at-trx-commit=0
      --sync-binlog=0
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 40

  mariadb-lts:
    image: mariadb:${MARIADB_LTS_VERSION:-10.11}
    environment:
      MARIADB_ROOT_PASSWORD: kaname
      MARIADB_DATABASE: kaname_test
      MARIADB_USER: kaname
      MARIADB_PASSWORD: kaname
    ports:
      - "53308:3306"
    tmpfs:
      - /var/lib/mysql
    command: >
      --innodb-flush-log-at-trx-commit=0
      --sync-binlog=0
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 40

  # SQLite no tiene servicio: es un archivo. Los tests crean el suyo en un
  # directorio temporal y lo borran. Está acá escrito para que nadie lo busque.

  # Servidor SSH para los tests del túnel de la Iteración 3.
  #
  # Sin esto no se puede verificar lo único que importa de verdad acá: que el
  # TOFU sea real, que una clave cambiada se rechace, y que el reenvío llegue a
  # Postgres. Son las tres cosas que no se pueden dar por sentadas.
  #
  # PASSWORD_ACCESS con credenciales de juguete: la prueba de autenticación por
  # clave usa una que generan los tests, no una guardada en el repo.
  sshd:
    build:
      context: ./docker/sshd
    ports:
      - "52222:2222"
    # El túnel necesita AllowTcpForwarding. La imagen lo trae habilitado, pero
    # de eso no hay garantía escrita en ningún lado: si un cambio de default lo
    # apagara, los tests del túnel fallarían con un error de reenvío y no con
    # "la configuración cambió". El test lo comprueba explícitamente.
    healthcheck:
      # netstat y no `nc -z`: el nc de busybox no soporta -z y sale con 1
      # aunque el puerto esté escuchando. El healthcheck daba "unhealthy" con el
      # servidor perfectamente sano, y en CI eso rompe el job sin que nada esté
      # roto de verdad.
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':2222 '"]
      interval: 2s
      timeout: 3s
      retries: 30
