# Paquetes .deb / .rpm / Arch. Los arma `wails3 tool package` con nfpm
# embebido, desde `wails3 task linux:package`. Documentación del formato:
# https://nfpm.goreleaser.com
#
# El binario se llama `kaname` —no `kaname.exe`, que es lo que el template
# escribió acá porque lo generó con el nombre del binario de Windows— y va a
# /usr/bin, que es donde un paquete del sistema instala; /usr/local es para
# lo que instala la persona a mano.

name: "kaname"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "database"
priority: "optional"
maintainer: "Luciano Rodriguez <luciano.rodriguez.dev@gmail.com>"
description: "Gestor de bases de datos con diagrama ERD editable"
vendor: "Kaname"
homepage: "https://github.com/LucianoR23/kanamedb"
license: "Apache-2.0"
release: "1"

contents:
  - src: "./bin/kaname"
    dst: "/usr/bin/kaname"
    file_info:
      mode: 0755
  - src: "./build/linux/kaname.desktop"
    dst: "/usr/share/applications/kaname.desktop"
    file_info:
      mode: 0644
  # Los nueve tamaños del brand kit más el SVG escalable, en el árbol hicolor
  # de freedesktop. El nombre del archivo tiene que coincidir con `Icon=kaname`
  # del .desktop.
  - src: "./build/linux/icons/hicolor"
    dst: "/usr/share/icons/hicolor"
    type: tree
  - src: "./LICENSE"
    dst: "/usr/share/doc/kaname/copyright"
    file_info:
      mode: 0644

# GTK4 + WebKitGTK 6.0, el backend de Linux por defecto de Wails v3 beta.17.
# Es lo que fija qué distros lo corren: Ubuntu 24.04 / Debian 13 o más nuevas.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  # Fedora / RHEL / AlmaLinux / Rocky
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  # Arch
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
