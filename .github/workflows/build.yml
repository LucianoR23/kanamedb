name: build

on:
  push:
    branches: [main]
    # Un tag v* arma además el release (borrador) con los binarios de los
    # tres sistemas y su SHA256SUMS. Ver el job `release`.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-beta.17

jobs:
  check:
    name: Lint y typecheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # El paquete main embebe frontend/dist con go:embed, y dist es un
      # artefacto de build que no se commitea. Sin el directorio, `go vet` y
      # `go test` ni siquiera compilan main: fallan con "no matching files
      # found". El marcador vacío alcanza para compilar —acá no se ejecuta la
      # interfaz— y el frontend de verdad lo construye el job de build.
      - name: Marcador para el go:embed del frontend
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear:"; echo "$unformatted"; exit 1
          fi

      # Si go.mod queda desprolijo, la limpieza aparece como ruido en el
      # siguiente commit que corra tidy. Mejor que falle acá.
      - name: go mod tidy está al día
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # Lo que go vet no mira y un bump de dependencia necesita: SA1019 marca
      # cada uso de algo DEPRECADO, que compila hoy y en dos versiones no
      # existe. Sin esto, el PR de Dependabot pasa en verde con el aviso
      # adentro del changelog que nadie leyó. Las comprobaciones apagadas están
      # en staticcheck.conf, con el motivo.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...

      # Lo único que avisa de un CVE en una dependencia. Sin esto, "pineado"
      # se convierte en "viejo" sin que nadie se entere: el lockfile y go.sum
      # garantizan que se compila siempre lo mismo, no que ese "lo mismo" siga
      # siendo seguro.
      #
      # Solo reporta vulnerabilidades ALCANZABLES desde nuestro código, así que
      # un CVE en una función que no llamamos no rompe el build por nada.
      #
      # Consulta vuln.go.dev desde CI. La aplicación sigue sin hacer ninguna
      # llamada de red por su cuenta: esto corre en el runner, no en el binario.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      # El detector de carreras no existe en windows/arm64, que es la máquina de
      # desarrollo. Este job corre en amd64: es el único lugar donde se puede
      # verificar el código concurrente (el Store lo usan varias goroutines).
      - name: go test (con detector de carreras)
        run: go test -p 1 -race ./...

      - name: Instalar deps del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Instalar el CLI de Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # Los bindings son el contrato Go<->TS. Sin generarlos, el typecheck no
      # valida las llamadas del frontend a los servicios de Go.
      - name: Generar bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Typecheck del frontend
        working-directory: frontend
        run: pnpm run typecheck

  # Secretos en el historial ENTERO, no solo en el árbol de este commit. Es la
  # condición para que el repo sea público —publicar el repo publica los
  # commits, y una contraseña commiteada y borrada al siguiente sigue en
  # `git log -p`— y después de público sigue corriendo en cada push, que es
  # cuando más importa: lo que entra a main es público en segundos.
  #
  # Las reglas están en .gitleaks.toml: las de gitleaks más dos propias, porque
  # las de fábrica dejaban pasar `postgres://usuario:contraseña@host`, que es
  # justo el secreto que este proyecto podría filtrar.
  secretos:
    name: Secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Sin esto checkout baja UN commit y «todo el historial» es uno. El
          # último paso lo comprueba en vez de confiar.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Con go install y no con la GitHub Action de gitleaks: versión exacta e
      # integridad por el checksum database de Go, igual que govulncheck, y sin
      # la validación de licencia contra un servidor externo que la action hace
      # en repos de organización.
      - name: Instalar gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      # Primero se comprueba que la configuración detecta lo que dice detectar:
      # una DSN y un `password = "…"` con una contraseña de baja entropía, que
      # las reglas de fábrica no ven. La muestra se arma acá, en partes, para
      # que este archivo no contenga la forma que busca la regla. Sin este
      # paso, un .gitleaks.toml roto —una regla mal escrita, una lista blanca
      # demasiado ancha— dejaría el job verde sin mirar nada.
      - name: La configuración detecta lo que dice detectar
        run: |
          pw=hola1234
          m="$RUNNER_TEMP/muestra"
          mkdir -p "$m"
          { printf 'dsn = "postgres://app:'; printf '%s' "$pw"; printf '@db.example.com:5432/app"\n'; } > "$m/config.toml"
          { printf 'password = "'; printf '%s' "$pw"; printf '"\n'; } >> "$m/config.toml"
          if gitleaks dir "$m" --config .gitleaks.toml --no-banner --redact --report-format json --report-path "$m/informe.json"; then
            echo "gitleaks no detectó la muestra: .gitleaks.toml no sirve"; exit 1
          fi
          # gitleaks sale con 1 tanto si encontró algo como si la config no
          # parsea; el informe distingue los dos casos.
          test -s "$m/informe.json" || { echo "gitleaks no escribió el informe: revisar .gitleaks.toml"; exit 1; }
          for regla in kaname-dsn-con-contrasena kaname-password-literal; do
            if ! jq -e --arg r "$regla" 'any(.[]; .RuleID == $r)' "$m/informe.json" >/dev/null; then
              echo "la regla $regla no disparó sobre la muestra"; exit 1
            fi
          done

      # --redact es obligatorio: si un día encuentra algo, sin él lo imprime en
      # el log del job, y el log de un repo público es público.
      - name: gitleaks sobre todos los commits
        run: |
          commits=$(git rev-list --count --all)
          echo "commits en el clon: $commits"
          if [ "$commits" -lt 2 ]; then
            echo "el clon no trae el historial: revisar fetch-depth"; exit 1
          fi
          gitleaks git --log-opts=--all --config .gitleaks.toml --no-banner --redact
  # Los tests de integración corren en Linux: los servicios de contenedor de
  # GitHub Actions no funcionan en los runners de Windows, y las capas de datos
  # de este proyecto son Go puro e independientes del sistema operativo. Lo
  # específico de Windows —el keychain— se prueba en el job de arriba.
  integration:
    name: Integración · PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La estable actual, más las anteriores que se declaran soportadas.
        postgres: ["18", "17", "16", "14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Se levanta con el mismo compose que se usa localmente, y no con los
      # `services:` de Actions, por una razón concreta: el servidor SSH de
      # pruebas se construye desde un Dockerfile propio —hizo falta para poder
      # habilitar AllowTcpForwarding— y `services:` solo acepta imágenes ya
      # publicadas.
      #
      # De paso, CI y la máquina de desarrollo levantan exactamente lo mismo, y
      # un test que pasa en una tiene motivos para pasar en la otra.
      - name: Levantar los motores de prueba
        env:
          PG_VERSION: ${{ matrix.postgres }}
        run: docker compose -f docker-compose.test.yml up -d --wait

      # -count=1 obligatorio: la caché de go test no sabe contra qué versión de
      # motor está corriendo, así que sin él una corrida contra la 16 podría
      # devolver el resultado cacheado de la corrida contra la 18.
      #
      # KANAME_REQUIRE_POSTGRES, KANAME_REQUIRE_SSH y KANAME_REQUIRE_ENGINES
      # convierten el "saltear" en "fallar": si el mapeo de puertos o el tag de
      # la imagen se rompen, este job tiene que ponerse rojo y no verde sin
      # haber probado nada.
      #
      # KANAME_EXPECT_PG_MAJOR verifica que esta pata esté hablando con la
      # versión que dice, y no cuatro veces con el mismo servidor.
      #
      # Va sobre ./internal/... y no ./...: compilar el paquete main en Linux
      # arrastra el backend GTK4/WebKitGTK de Wails, que este runner no tiene y
      # que instalar acá no probaría nada —el binario de Linux lo arma el job
      # `build-linux`—. Que main compile lo cubre el job `check`, en Windows.
      - name: Tests de integración
        env:
          KANAME_REQUIRE_POSTGRES: "1"
          KANAME_REQUIRE_SSH: "1"
          # Lo mismo para las dos MySQL, las dos MariaDB y la batería de
          # motores. Sin esto, un contenedor que no arranca deja esos tests
          # salteados y el job en verde. Pasó: MariaDB estuvo salteándose sin
          # que nadie lo notara.
          KANAME_REQUIRE_ENGINES: "1"
          KANAME_EXPECT_PG_MAJOR: ${{ matrix.postgres }}
        # -p 1 obligatorio: `go test` corre los binarios de cada paquete EN
        # PARALELO, y los de postgres y service escriben en la misma base de
        # pruebas. Sin esto, un test que cuenta tablas visibles ve las que creó
        # otro paquete y falla de manera intermitente.
        run: go test -p 1 -count=1 ./internal/...

      # Si un test de SSH falla, el motivo suele estar del lado del servidor y
      # no del cliente. Sin esto habría que adivinar.
      - name: Logs de los motores si algo falló
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 60

  # Windows se distribuye como un .exe suelto: se copia y anda (WebView2 viene
  # con Windows 11). Sin firma: SmartScreen avisa la primera vez y se pasa con
  # «Más información → Ejecutar de todos modos». Ver kaname-plan.md.
  build:
    name: Build ${{ matrix.arch }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win-x64
            runner: windows-latest
            goarch: amd64
          - arch: win-arm64
            runner: windows-11-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar el CLI de Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Instalar deps del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build (bindings + frontend + syso + binario, tags production)
        run: wails3 task build ARCH=${{ matrix.goarch }}

      - name: Renombrar por arquitectura
        shell: bash
        run: mv bin/kaname.exe "bin/kaname-${{ matrix.arch }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: kaname-${{ matrix.arch }}
          path: bin/kaname-${{ matrix.arch }}.exe
          if-no-files-found: error

  # Linux no se cross-compila desde Windows: GTK4 y WebKitGTK entran por cgo.
  # Sale un AppImage (se copia y anda, sin instalar) más .deb y .rpm, que
  # declaran la dependencia de libgtk-4 y libwebkitgtk-6.0. No hay firma que
  # hacer en Linux; el release lleva SHA256SUMS.
  #
  # GTK4 + WebKitGTK 6.0 es el backend por defecto de Wails v3 beta.17, y fija
  # el piso: Ubuntu 24.04 / Debian 13. El runner es 24.04 a propósito y no
  # `ubuntu-latest`: un binario se construye sobre la base MÁS VIEJA que se
  # declara soportar, porque la glibc y WebKitGTK contra las que se linkea
  # son las mínimas que después va a exigir.
  build-linux:
    name: Build linux-x64
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Los -dev para compilar; gdk-pixbuf, glib y dpkg-dev los pide el
      # plugin de GTK de linuxdeploy al armar el AppImage.
      - name: Dependencias de GTK4 y WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgdk-pixbuf-2.0-dev libglib2.0-dev-bin librsvg2-dev dpkg-dev

      - name: Instalar el CLI de Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Instalar deps del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build (bindings + frontend + binario, tags production)
        run: wails3 task build

      # Tres pasos y no `linux:package`, para que si uno falla se vea cuál.
      # linuxdeploy se baja de GitHub en el momento; es la única descarga.
      - name: AppImage
        run: wails3 task linux:create:appimage

      - name: .deb y .rpm
        run: |
          wails3 task linux:create:deb
          wails3 task linux:create:rpm

      - name: Renombrar por arquitectura
        run: |
          mv bin/kaname-x86_64.AppImage bin/kaname-linux-x64.AppImage
          mv bin/kaname.deb bin/kaname-linux-x64.deb
          mv bin/kaname.rpm bin/kaname-linux-x64.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: kaname-linux-x64
          path: |
            bin/kaname-linux-x64.AppImage
            bin/kaname-linux-x64.deb
            bin/kaname-linux-x64.rpm
          if-no-files-found: error

  # macOS: un .app universal (arm64 + x86_64 con lipo) dentro de un .zip. Con
  # Xcode 26 en el runner, actool compila build/appicon.icon —la marca por
  # capas de Icon Composer— a Assets.car e icons.icns; sin él quedaría el
  # icns plano del tile, que es el commiteado.
  #
  # Sin Developer ID ni notarización: el bundle va con firma ad-hoc, así que
  # desde macOS 15 Gatekeeper lo frena y hay que ir a Ajustes → Privacidad y
  # seguridad → «Abrir de todos modos». Quien clona y compila no ve nada de
  # eso. Firmarlo cuesta USD 99/año; ver kaname-plan.md.
  build-macos:
    name: Build mac-universal
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar el CLI de Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Instalar deps del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build universal + .app (bindings + frontend + Assets.car + lipo)
        run: wails3 task darwin:package:universal

      # El .app tiene que llegar entero: ditto conserva los atributos del
      # bundle, que un zip común pierde.
      - name: Empaquetar
        run: ditto -c -k --sequesterRsrc --keepParent bin/kaname.app bin/kaname-mac-universal.zip

      - uses: actions/upload-artifact@v7
        with:
          name: kaname-mac-universal
          path: bin/kaname-mac-universal.zip
          if-no-files-found: error


  # Android: el APK arm64, en cada push a main como los demás sistemas y en
  # el release con un tag. Vivía en un workflow aparte (`android`, sobre
  # `spike/android`) mientras era un spike; desde que la app del teléfono es
  # un producto, se construye junto con el resto.
  #
  # Va por CI y no en la máquina de desarrollo porque el Taskfile de Android
  # de Wails solo resuelve el toolchain del NDK en Linux y macOS x86_64; el
  # equipo de desarrollo es windows/arm64. Es la única plataforma del
  # proyecto que necesita cgo.
  build-android:
    name: Build android-arm64
    needs: check
    runs-on: ubuntu-latest
    env:
      # Pineado como todo lo demás. Es el que sugiere el propio Taskfile de
      # Wails cuando no encuentra ninguno.
      NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # AGP 8.7 y el wrapper de Gradle 9.2 piden JDK 17 como mínimo.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El runner trae el SDK en $ANDROID_HOME con cmdline-tools; lo que se
      # instala explícito es el NDK, la plataforma y las build-tools, con
      # versión, para que el build no dependa de lo que la imagen tenga hoy.
      - name: NDK, plataforma y build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # El CLI de Wails en Linux se compila con cgo y linkea GTK4 y WebKitGTK
      # (internal/operatingsystem), aunque el objetivo sea Android. Son los
      # mismos -dev del job build-linux.
      - name: Dependencias de GTK4 y WebKitGTK para compilar el CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Instalar el CLI de Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Instalar deps del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # La firma. Con los cuatro secretos puestos, el APK sale firmado con ESA
      # clave en cada corrida, y el teléfono acepta la versión nueva encima de
      # la vieja. Sin ellos, Gradle firma con el keystore de debug del runner,
      # que es una máquina nueva cada vez: una clave distinta por corrida, y
      # el teléfono rechaza actualizar («el paquete entra en conflicto») hasta
      # desinstalar, con lo que se pierde lo guardado en el vault. Cómo
      # crearlos, en el README, «Android › Firmar».
      - name: Keystore de firma, si hay
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kaname.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/kaname.jks" >> "$GITHUB_ENV"

      # Dos pasos y no `android:package`, para que si uno falla se vea cuál:
      # primero el .so (overlay + bindings + frontend + go build c-shared con
      # el NDK), después Gradle. Build de producción (-trimpath, -w -s, tag
      # production).
      - name: libwails.so (bindings + frontend + go build c-shared)
        run: wails3 task android:build ARCH=arm64 PRODUCTION=true

      - name: APK (Gradle assembleRelease)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: wails3 task android:assemble:apk:release

      - name: Tamaños y nombre por arquitectura
        run: |
          ls -l build/android/app/src/main/jniLibs/arm64-v8a/libwails.so bin/kaname.apk
          mv bin/kaname.apk bin/kaname-android-arm64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: kaname-android-arm64
          path: bin/kaname-android-arm64.apk
          if-no-files-found: error

  # Con un tag v*: un release EN BORRADOR con los siete archivos y su
  # SHA256SUMS. Borrador a propósito: se publica a mano después de mirar las
  # notas y, si hay con qué, de abrir el binario de macOS o Linux en una
  # máquina de verdad. Es el único job que escribe en el repositorio.
  release:
    # Nombre fijo a propósito: cuando el job se saltea —todo push que no es
    # un tag— GitHub muestra el `name:` sin evaluar, y «Release
    # ${{ github.ref_name }}» parece un error que no es.
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # El tag tiene que ser la versión que llevan los binarios. Alcanza con
      # mirar appinfo.Version: `go test ./` ya obliga a que config.yml,
      # info.json, los Info.plist y nfpm.yaml digan lo mismo que ella. Sin
      # esto, un `v0.2.0` sobre binarios 0.1.0 sale con el título bien y todo
      # lo de adentro mal.
      - name: El tag coincide con appinfo.Version
        run: |
          esperada="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "Version += \"${esperada}\"" internal/appinfo/appinfo.go; then
            echo "El tag $GITHUB_REF_NAME no coincide con internal/appinfo/appinfo.go:"
            grep -nE 'Version +=' internal/appinfo/appinfo.go || true
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: artefactos
        run: sha256sum kaname-* | tee SHA256SUMS

      - name: Crear el borrador del release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Kaname $GITHUB_REF_NAME" \
            --generate-notes \
            artefactos/*
