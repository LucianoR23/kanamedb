name: android

# APK de Android para instalar a mano. Es un workflow aparte de `build` y no
# corre en cada push a main: la app de Android es un segundo producto (ver
# kaname-android.md) y mientras sea un spike no tiene que frenar el escritorio.
#
# Va por CI y no en la máquina de desarrollo porque el Taskfile de Android de
# Wails solo resuelve el toolchain del NDK en Linux y macOS x86_64; el equipo
# de desarrollo es windows/arm64. Es la única plataforma del proyecto que
# necesita cgo.
on:
  push:
    branches: [spike/android]
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-beta.17
  # Pineado como todo lo demás. Es el que sugiere el propio Taskfile de Wails
  # cuando no encuentra ninguno.
  NDK_VERSION: 26.3.11579264

jobs:
  apk:
    name: APK arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # AGP 8.7 y el wrapper de Gradle 9.2 piden JDK 17 como mínimo.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # El runner trae el SDK en $ANDROID_HOME con cmdline-tools; lo que se
      # instala explícito es el NDK, la plataforma y las build-tools, con
      # versión, para que el build no dependa de lo que la imagen tenga hoy.
      - name: NDK, plataforma y build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Instalar el CLI de Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Instalar deps del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Dos pasos y no `android:package`, para que si uno falla se vea cuál:
      # primero el .so (overlay + bindings + frontend + go build c-shared con
      # el NDK), después Gradle.
      - name: libwails.so (bindings + frontend + go build c-shared)
        run: wails3 task android:build ARCH=arm64

      - name: APK (Gradle assembleDebug)
        run: wails3 task android:assemble:apk

      # Lo que el spike tiene que medir: tamaño del .so y del APK.
      - name: Tamaños
        run: |
          ls -l build/android/app/src/main/jniLibs/arm64-v8a/libwails.so bin/kaname.apk
          mv bin/kaname.apk bin/kaname-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kaname-android-arm64
          path: bin/kaname-android-arm64.apk
          if-no-files-found: error
