# Configuración de gitleaks. CI la corre en cada push sobre el historial ENTERO
# (job `secretos`), y se corre igual acá:
#
#   go install github.com/zricethezav/gitleaks/v8@v8.30.1
#   gitleaks git --log-opts=--all --redact --config .gitleaks.toml
#
# Las reglas por defecto conocen tokens de proveedores —GitHub, AWS, Stripe…—
# y claves privadas, y tienen una regla genérica que exige entropía alta. Lo
# que NO conocen es la forma que tendría un secreto de este proyecto: una
# connection string con la contraseña adentro, o un `password = "…"` con una
# contraseña de persona —«mascota2020»— que no llega a la entropía mínima. Se
# comprobó: sin las dos reglas de abajo, `postgres://app:Xk9…@db.example.com`
# pasa limpio.
#
# Cada contraseña de mentira de los tests que las dispara está en la lista
# blanca POR SU VALOR, no por su archivo: una lista por archivo dejaría pasar
# una DSN real pegada «un momento» en un test. Agregar una contraseña de
# mentira nueva a un test es agregarla acá, a conciencia.

[extend]
useDefault = true

[[rules]]
id = "kaname-dsn-con-contrasena"
description = "Connection string con la contraseña adentro: motor://usuario:contraseña@host"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|sqlserver|mssql|mongodb(?:\+srv)?|rediss?|amqps?|clickhouse|ssh|sftp|ftp|https?)://[^:/\s"'`@]+:([^@/\s"'`]+)@'''
secretGroup = 1
keywords = ["postgres", "mysql", "mariadb", "sqlserver", "mssql", "mongodb", "redis", "amqp", "clickhouse", "ssh", "sftp", "ftp", "http"]

[[rules.allowlists]]
description = "Contraseñas de mentira de los tests y palabras de relleno de los comentarios"
regexTarget = "secret"
regexes = ['''^(?i:kaname|secret[ao]?|s3cr3t|contrase[ñn]a|password|clave|hunter2|p4ssw0rd|toor|simple123|uno|dos|a%b|a%40b(?:%3Ac)?|100%descuento)$''']

# La clave puede llevar prefijo en MAYÚSCULAS (`DBPASSWORD`, `POSTGRES_PASSWORD`)
# o con guion bajo (`db_password`), y puede ir entre comillas (JSON). Lo que no
# puede es ser camelCase: `sshPassword = "kaname"` o
# `sqlStateInvalidPassword = "28P01"` son identificadores de Go, y una lista
# blanca de identificadores es la que hace que la gente apague el escáner.
[[rules]]
id = "kaname-password-literal"
description = "password = \"valor\": la clave exacta y el valor entre comillas, sin exigir entropía"
regex = '''\b(?:[A-Z0-9_]*|[a-z0-9_]*_)?(?i:password|passwd|pwd)["']?\s*[=:]\s*["']([^"'\s]{4,})["']'''
secretGroup = 1
keywords = ["password", "passwd", "pwd"]

[[rules.allowlists]]
description = "Contraseñas de mentira de los tests"
regexTarget = "secret"
regexes = ['''^(?i:kaname|tampoco|topsecret|pw-s3cr3t|s3cr3t)$''']

[[rules.allowlists]]
description = "Un ternario de TypeScript —`? \"password\" : \"text\"`— no es una asignación"
regexTarget = "line"
regexes = ['''\?\s*["'](?i:password|passwd|pwd)["']\s*:''']
